[tool.poetry]
name = "rdrama"
version = "0.1.0"
description = ""
authors = ["Your Name <you@example.com>"]
license = "AGPL"
package-mode = false

[tool.poetry.dependencies]
python = "~3.13"
beautifulsoup4 = "*"
bleach = "*"
tinycss2 = "*"
Flask = "*"
Flask-Caching = "*"
Flask-Compress = "*"
Flask-Mail = "*"
Flask-Migrate = "*"
Flask-Socketio = "*"
gunicorn = "*"
eventlet = "*"
lxml = "*"
mistletoe = "*"
matplotlib = "*"
Pillow = "*"
psutil = "*"
pyotp = "*"
python-dotenv = "*"
qrcode = "*"
redis = "*"
requests = "*"
SQLAlchemy = "*"
user-agents = "*"
psycopg2 = "*"
yattag = "*"
webptools = "*"
supervisor = "*"
superlance = "*"
setuptools = "*"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
pytest = "*"
pytest-cov = "*"
pytest-xdist = "^3.8.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
# Without a path, collect only the test suite
testpaths = ["files/tests"]
norecursedirs = [
    "thirdparty/*",
]

[tool.coverage.run]
source = ["files"]
branch = true
omit = [
    # Not loaded in the tested configuration (THEMOTTE service, non-debug); deliberately outside the spec
    "files/routes/chat.py",
    "files/routes/dev.py",
    # Signals the gunicorn processes of the serving pod; deployment-specific process control, deliberately outside the spec
    "files/routes/admin/performance.py",
    # Developer tools (filling a dev database, profiling a page render); deliberately outside the spec
    "files/commands/seed_db.py",
    "files/commands/profile_url.py",
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/migrations/*",
    "*/thirdparty/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
]
skip_covered = false
show_missing = true
precision = 2

[tool.coverage.html]
directory = "htmlcov"
